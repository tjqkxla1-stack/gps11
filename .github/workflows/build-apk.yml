      - name: Configure JDK 17 & Gradle 8.7 and Build Debug APK
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "${JAVA_HOME_17_X64}" ]; then
            export JAVA_HOME="${JAVA_HOME_17_X64}"
            export PATH="${JAVA_HOME}/bin:${PATH}"
          fi
          java -version
          if [ ! -f /opt/gradle/gradle-8.7/bin/gradle ]; then
            curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
            sudo mkdir -p /opt/gradle
            sudo unzip -q -o /tmp/gradle-8.7-bin.zip -d /opt/gradle
          fi
          /opt/gradle/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GandanSurvey_V90_Installable.apk
          ls -lh GandanSurvey_V90_Installable.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GandanSurvey-GPS-Installable-APK
          path: GandanSurvey_V90_Installable.apk
          if-no-files-found: error
