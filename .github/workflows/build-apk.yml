name: Build GandanSurvey GPS Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Fixed Signing Key & Restore Complete Project Files
        run: |
          python3 - << 'PYEOF'
          import os, json, zlib, base64

          # 1. 고정 서명키(debug.keystore) 설치 -> 기존 앱 삭제 없이 바로 '업데이트 덮어쓰기' 가능
          FIXED_KEYSTORE_B64 = base64.b64decode("").decode("utf-8").strip().replace("\n", "").replace(" ", "")
          android_dir = os.path.expanduser("~/.android")
          os.makedirs(android_dir, exist_ok=True)
          with open(os.path.join(android_dir, "debug.keystore"), "wb") as kf:
              kf.write(base64.b64decode(FIXED_KEYSTORE_B64))
          print("Installed fixed ~/.android/debug.keystore")

